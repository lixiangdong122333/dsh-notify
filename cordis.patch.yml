# Registers the "task finished / needs you" Windows notification for DSH.
# Everything tunable lives in the `dsh-notify` row's `config` in the profile
# patch, which survives DSH upgrades. The same values are editable from
# Settings → Plugins → this plugin; both write this section.
#
# Every key below is optional, and the values shown are the defaults, so a row
# with an empty `config` behaves exactly like this one.
- insert:
    - id: dsh-notify
      name: '@cmwl1231/dsh-notify'
      config:
        onTurnEnd: true
        notifyEndKinds:
          - completed
          - error
          - max-tokens
        minTurnMs: 0
        notifyQuestions: true
        notifyPlanReviews: false
        questionDelayMs: 6000
        skipWhenFocused: true
        skipWhenOthersRunning: true
        bodySource: answer
        bodyLength: 150
        sound: default
        titleCompleted: DSH · 任务完成
        titleEnded: DSH · 任务已结束
        titleQuestion: DSH · 需要你确认