# Test every change, and stage a release when a version tag is pushed.
#
# Staging, not publishing: the npm token this repo uses is stage-only, so CI can
# put a version in the queue but cannot make it installable. A maintainer still
# approves it with 2FA at https://www.npmjs.com/package/@cmwl1231/dsh-notify,
# which is the one step that should never be automated.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin only ever runs on Windows, but it is plain Node: keeping a
        # second runner catches a POSIX-only assumption in the logic itself.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # --ignore-scripts and --no-save keep this a test-only install. The package
      # declares `os: win32`, so npm refuses to install it on the Linux runner;
      # --force overrides that, which is fine here because the logic under test
      # is plain Node and the Windows-only parts sit behind the test-mode switch.
      - name: Install dependencies
        run: npm install --no-save --ignore-scripts --force @deepseek-ai/schemastery@~3.18.5

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  toast:
    name: Toast delivery (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Raises a real toast and reads the payload back where the Windows build
      # exposes notification history. A separate job because it checks the
      # delivery path (WinRT through PowerShell), not the plugin logic. It now
      # gates: the suite skips only the send, and only when DeepSeek-Harness is
      # not installed here, so a failure here is a real one.
      - name: Toast payload and encoding
        shell: powershell
        run: ./test-toast.ps1

  stage:
    name: Stage release on npm
    # Only a version tag stages anything; a normal push just tests.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The tag is the promise that this commit is the release, so the version in
      # package.json has to agree with it; otherwise a mistyped tag would stage a
      # version nobody intended.
      - name: Check the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Tag and package.json agree on $pkg"

      - name: Refuse to stage an already published version
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          published="$(npm view "@cmwl1231/dsh-notify@$pkg" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "::error::$pkg is already published"
            exit 1
          fi
          echo "$pkg is not published yet"

      - name: Install dependencies
        run: npm install --no-save --ignore-scripts --force @deepseek-ai/schemastery@~3.18.5

      # npm 11 (the version bundled with Node 22) has no `stage` command; npm 12
      # is required for staged publishing.
      - name: Stage the version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npx --yes npm@latest stage publish . --access public

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release staged"
            echo
            echo "- Version: \`$(node -p "require('./package.json').version")\`"
            echo "- Approve it to publish: https://www.npmjs.com/package/@cmwl1231/dsh-notify"
            echo
            echo "A stage-only token cannot make a version installable. The version"
            echo "stays invisible to \`npm install\` until a maintainer approves it with 2FA."
          } >> "$GITHUB_STEP_SUMMARY"
